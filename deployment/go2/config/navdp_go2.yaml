navdp_go2_adapter:
  ros__parameters:
    # Machine/experiment-owned values (backend, mode, server, physical sensor
    # topics, command topic, ImageGoal and speed limits) are injected from the
    # immutable resolved runtime config by run_adapter.sh.
    image_goal_debug_topic: /navdp/image_goal
    path_topic: /navdp/trajectory
    status_topic: /navdp/status
    cec_receipt_topic: /navdp/cec_receipt
    debug_markers_topic: /navdp/debug/markers
    enable_topic: /navdp/enabled
    estop_topic: /navdp/estop
    arrival_topic: /navdp/arrival
    base_frame: base_link

    debug_visualization: true
    debug_max_candidates: 6
    enable_on_start: false
    estop_on_start: true
    plan_while_disabled: true
    two_phase_episode: false
    auto_goal_candidate_interval_frames: 24
    auto_goal_candidate_max: 6
    auto_goal_candidate_post_guard_frames: 4
    auto_select_goal_candidate: true
    planning_rate_hz: 1.5
    geometry_rate_hz: 3.0
    # Opt in only for supervised swept-footprint commissioning.
    low_critic_search_enabled: false
    control_rate_hz: 20.0
    connect_timeout_s: 3.0
    request_timeout_s: 180.0
    # Runtime RGB-D age >2 s pauses motion. Fresh post-stop RGB-D and a new
    # accepted plan resume this run; explicit Stop and hard faults stay latched.
    # Initial arming still requires <=0.60 s freshness.
    sensor_timeout_s: 2.00
    trajectory_timeout_s: 5.00
    max_rgb_depth_skew_s: 0.10
    # Keep only a small pairing backlog. Post-stop admission below uses source
    # timestamps as the authority, but a shorter queue also avoids wasted
    # conversion work when the Jetson is busy.
    rgbd_sync_queue_size: 5
    depth_scale_m: 0.001
    lookahead_m: 0.60
    heading_deadband_rad: 0.13962634015954636  # 8 deg; validated TinyNav anti-hunting gate
    rotate_in_place_angle_rad: 0.70
    rotate_gain: 1.50
    slow_path_length_m: 0.30
    # A local segment ends before its tapered velocity falls into the Go2 gait
    # dead zone. This does not declare ImageGoal arrival; it stops, senses and
    # asks for a fresh plan.
    local_completion_tolerance_m: 0.15
    # If a meaningful forward command produces less than 2 cm of path progress
    # in four seconds, stop this local action and replan from post-stop RGB-D.
    stagnation_timeout_s: 4.0
    stagnation_min_progress_m: 0.02
    stagnation_min_linear_mps: 0.08
    allow_reverse: false
    reverse_lateral_angle_rad: 0.55
    max_linear_accel_mps2: 0.45
    max_angular_accel_rps2: 1.00

    # Replan during motion; anchor each returned trajectory at RGB exposure.
    # No mandatory stop every 0.3 m. Sensor gaps/stops still require fresh RGB.
    latency_motion_guard_enabled: true
    latency_max_plan_input_age_s: 1.50
    settle_before_sense_s: 0.15

    # Rear goals use continuous pure-yaw control with measured Go2 IMU
    # heading. Finish within 8 degrees, then stop and admit a fresh RGB-D plan.
    # No creep pulse or 10-degree action slicing is used during heading turns.

    # Tight indoor lab setting requested by the operator. There is no soft
    # slowdown band: motion is unchanged above 0.35 m and hard-stops at or
    # below 0.35 m for any motion. Front ROI clearance alone does not prove
    # swept-side clearance for a turn.
    # Invalid depth remains fail-closed for every motion command.
    depth_hard_stop_m: 0.35
    depth_percentile: 10.0
    depth_roi_left: 0.35
    depth_roi_right: 0.65
    depth_roi_top: 0.30
    depth_roi_bottom: 0.70
    depth_min_valid_fraction: 0.03
    depth_max_valid_m: 5.0
    depth_fail_closed: true
